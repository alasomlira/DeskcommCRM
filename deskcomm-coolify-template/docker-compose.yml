name: deskcommcrm

# Coolify template: Supabase Cloud + an existing Cloudflare Tunnel container.
# The tunnel container must also be connected to TUNNEL_NETWORK and its public
# hostname must target http://deskcommcrm-app:3000.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  bootstrap:
    image: postgres:17-alpine
    restart: "no"
    env_file: .env
    environment:
      OWNER_EMAIL: ${OWNER_EMAIL:?Set OWNER_EMAIL in Coolify}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?Set OWNER_PASSWORD in Coolify}
      APP_LOCALE: ${APP_LOCALE:-pt-BR}
    volumes:
      - bootstrap-state:/state
    configs:
      - source: bootstrap-script
        target: /bootstrap.sh
        mode: 0555
    command: ["/bin/sh", "/bootstrap.sh"]
    networks: [internal]

  app:
    image: ${APP_IMAGE:-ghcr.io/melgarafael/deskcommcrm:stable}
    restart: unless-stopped
    mem_limit: ${APP_MEM_LIMIT:-768m}
    env_file: .env
    environment:
      SUPABASE_DB_ADMIN_URL: ""
      EVENT_LOG_WORKER_DRAINS: ${EVENT_LOG_WORKER_DRAINS:-true}
      # White-label defaults for this fork. The app generates `/icon` at
      # runtime, so APP_NAME makes the tab title and favicon show "Brum - CRM"
      # and a B icon without baking an asset into the shared image.
      APP_NAME: "${APP_NAME:-Brum - CRM}"
      APP_ACCENT_HEX: "${APP_ACCENT_HEX:-#86a77f}"
      # Cloudflare writes the real visitor address here. Passing it to the app
      # keeps login/signup rate limits per visitor instead of per proxy/VPS.
      IP_DO_CLIENTE_HEADER: ${IP_DO_CLIENTE_HEADER:-cf-connecting-ip}
      # Explicitly declared so Coolify passes these values to the Next.js app.
      # `env_file` alone does not expose undeclared Compose variables in all
      # Coolify deployment modes.
      WAHA_API_BASE_URL: ${WAHA_API_BASE_URL:-http://waha:3000}
      WAHA_API_KEY: ${WAHA_API_KEY:?Set WAHA_API_KEY in Coolify}
      WAHA_WEBHOOK_BASE_URL: ${WAHA_WEBHOOK_BASE_URL:-http://app:3000}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      srh:
        condition: service_started
      waha:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging
    networks:
      internal: {}
      tunnel:
        aliases:
          - ${TUNNEL_APP_ALIAS:-deskcommcrm-app}

  worker:
    image: ${WORKER_IMAGE:-ghcr.io/melgarafael/deskcomm-worker:stable}
    restart: unless-stopped
    mem_limit: ${WORKER_MEM_LIMIT:-512m}
    env_file: .env
    environment:
      WAHA_API_BASE_URL: ${WAHA_API_BASE_URL:-http://waha:3000}
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    networks: [internal]

  scheduler:
    image: ${SCHEDULER_IMAGE:-ghcr.io/melgarafael/deskcomm-scheduler:stable}
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: UTC
      INTERNAL_SECRET: ${INTERNAL_SECRET:?Set INTERNAL_SECRET in Coolify}
    depends_on:
      app:
        condition: service_healthy
    logging: *default-logging
    networks: [internal]

  waha:
    image: ${WAHA_IMAGE:-devlikeapro/waha:latest-2026.7.2}
    restart: unless-stopped
    mem_limit: ${WAHA_MEM_LIMIT:-1280m}
    environment:
      WAHA_API_KEY: "sha512:${WAHA_API_KEY_SHA512:?Set WAHA_API_KEY_SHA512 in Coolify}"
      WHATSAPP_HOOK_URL: ${WAHA_WEBHOOK_BASE_URL:?Set WAHA_WEBHOOK_BASE_URL}/api/v1/webhooks/waha
      WHATSAPP_HOOK_EVENTS: "message.any,message.ack,message.edited,message.revoked,session.status,state.change"
      WHATSAPP_HOOK_HMAC: ${WAHA_HMAC_SECRET:?Set WAHA_HMAC_SECRET in Coolify}
      WHATSAPP_DEFAULT_ENGINE: ${WHATSAPP_DEFAULT_ENGINE:-NOWEB}
      WHATSAPP_RESTART_ALL_SESSIONS: ${WHATSAPP_RESTART_ALL_SESSIONS:-True}
      WAHA_DASHBOARD_ENABLED: "false"
    volumes:
      - waha-data:/app/.sessions
      - waha-media:/app/.media
    logging: *default-logging
    networks: [internal]

  srh:
    image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN:?Set SRH_TOKEN in Coolify}
      SRH_CONNECTION_STRING: ${EXTERNAL_REDIS_URL:?Set EXTERNAL_REDIS_URL in Coolify}
    logging: *default-logging
    networks: [internal, redis-external]

volumes:
  bootstrap-state:
  waha-data:
  waha-media:

networks:
  internal:
    driver: bridge
  tunnel:
    external: true
    name: ${TUNNEL_NETWORK:-coolify}
  redis-external:
    external: true
    name: ${REDIS_NETWORK:-coolify}

configs:
  # Kept inside Compose because Coolify deploys the Compose definition but does
  # not guarantee arbitrary helper-file bind mounts in its artifact directory.
  bootstrap-script:
    content: |
      #!/bin/sh
      set -eu
      if [ -f /state/complete ]; then
        echo "bootstrap: already completed"
        exit 0
      fi

      : "$${SUPABASE_DB_URL:?SUPABASE_DB_URL is required}"
      : "$${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL is required}"
      : "$${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}"
      : "$${OWNER_EMAIL:?OWNER_EMAIL is required}"
      : "$${OWNER_PASSWORD:?OWNER_PASSWORD is required}"

      apk add --no-cache curl jq >/dev/null
      echo "bootstrap: checking Supabase schema"
      existing="$$(psql "$$SUPABASE_DB_URL" -tAc "select 1 from information_schema.tables where table_schema='public' and table_name='organizations' limit 1" | tr -d '[:space:]')"
      if [ "$$existing" != "1" ]; then
        echo "bootstrap: applying extensions and baseline schema"
        psql "$$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "create extension if not exists vector with schema public; create extension if not exists citext with schema public; create extension if not exists pg_trgm with schema public;"
        curl -fsSL https://raw.githubusercontent.com/melgarafael/DeskcommCRM/main/supabase/baseline.sql -o /tmp/baseline.sql
        psql "$$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f /tmp/baseline.sql
      fi

      payload="$$(jq -nc --arg email "$$OWNER_EMAIL" --arg password "$$OWNER_PASSWORD" --arg locale "$${APP_LOCALE:-pt-BR}" '{email:$$email,password:$$password,email_confirm:true,user_metadata:{locale:$$locale}}')"
      status="$$(curl -sS -o /tmp/create-owner.json -w '%{http_code}' -X POST "$$NEXT_PUBLIC_SUPABASE_URL/auth/v1/admin/users" -H "apikey: $$SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $$SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/json" -d "$$payload")"
      case "$$status" in 200|201|422) ;; *) cat /tmp/create-owner.json >&2; exit 1;; esac

      echo "bootstrap: creating owner organization and administrator role"
      psql "$$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -v owner_email="$$OWNER_EMAIL" -v app_locale="$${APP_LOCALE:-pt-BR}" <<'SQL'
      select set_config('deskcomm.owner_email', :'owner_email', false);
      select set_config('deskcomm.app_locale', :'app_locale', false);
      do $$$$
      declare v_uid uuid; v_org uuid;
      begin
        select id into v_uid from auth.users where email = current_setting('deskcomm.owner_email');
        if v_uid is null then raise exception 'owner was not created in Supabase Auth'; end if;
        select id into v_org from public.organizations where slug = 'minha-empresa';
        if v_org is null then
          insert into public.organizations (slug, display_name, legal_name, locale, created_by)
          values ('minha-empresa', 'Minha Empresa', 'Minha Empresa', current_setting('deskcomm.app_locale'), v_uid) returning id into v_org;
        end if;
        insert into public.user_organizations (user_id, organization_id, role, accepted_at)
        values (v_uid, v_org, 'admin', now()) on conflict (user_id, organization_id) do update set role = 'admin', revoked_at = null;
        if not exists (select 1 from public.platform_admins where user_id = v_uid and revoked_at is null) then
          insert into public.platform_admins (user_id, granted_by, scope, mfa_required, reason)
          values (v_uid, v_uid, 'full', false, 'Bootstrap Coolify');
        end if;
      end $$$$;
      SQL
      touch /state/complete
      echo "bootstrap: completed"

